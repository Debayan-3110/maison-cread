[alembic]
script_location = alembic
sqlalchemy.url = postgresql://postgres:password@localhost:5432/shopcread

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
console = StreamHandler
console.level = INFO
console.formatter = generic

[formatters]
generic = GenericFormatter
GenericFormatter.format = %(levelname)s: %(message)s

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers = console
